[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-tax-engine"
version = "0.1.0"
description = "Deterministic wallet evidence to tax-lot assessment engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wallet-tax-engine = "engine.interfaces.cli:main"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==8.4.2",
    "ruff==0.15.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["py.typed"]

[tool.setuptools.data-files]
"share/wallet-tax-engine/frontend" = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
    "frontend/*.svg",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E302", "E305"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
